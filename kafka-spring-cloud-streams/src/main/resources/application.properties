spring.application.name=kafka-spring-cloud-streams
server.port=8080

# Cluster Kafka Docker (partie 2) : 3 brokers exposés sur l'hôte
spring.cloud.stream.kafka.binder.brokers=${KAFKA_BROKERS:localhost:19092,localhost:29092,localhost:39092}
spring.cloud.stream.kafka.streams.binder.brokers=${KAFKA_BROKERS:localhost:19092,localhost:29092,localhost:39092}
# Les topics créés par le binder sont répliqués sur les 3 brokers
spring.cloud.stream.kafka.binder.replication-factor=${KAFKA_REPLICATION:3}

# Fonctions actives
spring.cloud.function.definition=pageEventConsumer;pageEventSupplier;pageEventFunction;kStreamFunction

# Consumer : écoute R1
spring.cloud.stream.bindings.pageEventConsumer-in-0.destination=R1
spring.cloud.stream.bindings.pageEventConsumer-in-0.group=tp-consumer

# Supplier : publie sur R2 toutes les 200 ms
spring.cloud.stream.bindings.pageEventSupplier-out-0.destination=R2
spring.cloud.stream.poller.fixed-delay=200

# Function (consumer & producer) : R2 -> R3
spring.cloud.stream.bindings.pageEventFunction-in-0.destination=R2
spring.cloud.stream.bindings.pageEventFunction-in-0.group=tp-function
spring.cloud.stream.bindings.pageEventFunction-out-0.destination=R3

# Kafka Streams : R2 -> R4
spring.cloud.stream.bindings.kStreamFunction-in-0.destination=R2
spring.cloud.stream.bindings.kStreamFunction-out-0.destination=R4
spring.cloud.stream.kafka.streams.binder.functions.kStreamFunction.applicationId=tp-kafka-analytics
# commit (et donc mise à jour du store / de R4) toutes les secondes au lieu de 30 s
spring.cloud.stream.kafka.streams.binder.configuration.commit.interval.ms=1000
